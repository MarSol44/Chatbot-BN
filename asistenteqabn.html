<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repositorio QA · Banco de la Nación</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E0A458'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='%230A0E13'%3EQA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0A0E13;
  --bg-side:#0C1218;
  --surface:#131C25;
  --block:#0F171F;
  --line:#1D2A36;
  --line-soft:#16212B;
  --text:#C6D3DF;
  --text-hi:#E8F0F7;
  --dim:#63768A;
  --dim-2:#4A5A6C;
  --green:#3FD68A;
  --green-dim:#2A8F5E;
  --blue:#1D3A57;
  --blue-hi:#2C5C8A;
  --amber:#E0A458;
  --amber-bg:rgba(224,164,88,.09);
  --yellow-bg:#E4B559;
  --yellow-card:#F2CA7A;
  --yellow-line:rgba(46,31,0,.25);
  --yellow-dash:rgba(46,31,0,.45);
  --yellow-ink:#2E1F00;
  --yellow-btn:#2E1F00;
  --red:#E5615E;
  --mono:ui-monospace,"IBM Plex Mono","Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:rgba(63,214,138,.25)}

.app{height:100vh;display:grid;grid-template-columns:312px 1fr}

/* ================= SIDEBAR ================= */
.side{background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;letter-spacing:.09em;color:var(--green);font-weight:600}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(63,214,138,.5);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,214,138,.45)}70%{box-shadow:0 0 0 7px rgba(63,214,138,0)}100%{box-shadow:0 0 0 0 rgba(63,214,138,0)}}
.ver{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim-2);margin-top:7px}

.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:11px 22px;border-left:2px solid transparent;color:var(--text)}
.nav-item .n{font-family:var(--mono);font-size:12px;color:var(--dim-2);min-width:16px}
.nav-item .t{font-size:14.5px}
.nav-item .flag{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--amber);opacity:.7}
.nav-item:hover{background:rgba(255,255,255,.028);color:var(--text-hi)}
.nav-item:focus-visible{outline:1px solid var(--green);outline-offset:-2px}
.nav-item[aria-current="true"]{background:rgba(63,214,138,.07);border-left-color:var(--green);color:var(--text-hi)}
.nav-item[aria-current="true"] .n{color:var(--green)}
.side-foot{border-top:1px solid var(--line);padding:14px 22px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim-2)}

/* ================= MAIN ================= */
.main{display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:16px;padding:16px 26px;border-bottom:1px solid var(--line)}
.burger{font-family:var(--mono);font-size:18px;color:var(--dim);line-height:1;padding:2px 4px}
.burger:hover{color:var(--green)}
.bar .where{font-family:var(--mono);font-size:15px;color:var(--text-hi);letter-spacing:.01em}
.bar .where .k{color:var(--green)}
.bar .count{font-family:var(--mono);font-size:11.5px;color:var(--dim-2)}
.bar .aigroup{margin-left:auto;display:flex;align-items:center;gap:12px}
.aistate{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.aistate .dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);flex:none}
.aistate[data-s="listo"] .dot{background:var(--green);box-shadow:0 0 7px var(--green)}
.aistate[data-s="listo"]{color:var(--green)}
.aistate[data-s="calentando"] .dot,.aistate[data-s="iniciando"] .dot{background:var(--amber);animation:blink 1.1s ease-in-out infinite}
.aistate[data-s="calentando"],.aistate[data-s="iniciando"]{color:var(--amber)}
.aistate[data-s="error"] .dot{background:#E06A5C}
.aistate[data-s="error"]{color:#E06A5C}
@keyframes blink{50%{opacity:.25}}
.aitoggle{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:5px 10px;background:var(--block);cursor:pointer}
.aitoggle[aria-pressed="true"]{border-color:var(--green-dim);color:var(--green);background:rgba(63,214,138,.07)}

/* ---- modo CHAT / ADMINISTRADOR ---- */
.modeswitch{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--mono)}
.modebtn{font-size:11px;letter-spacing:.08em;padding:6px 14px;color:var(--dim);background:var(--block)}
.modebtn:hover{color:var(--text-hi)}
.modebtn[aria-pressed="true"]{background:var(--green-dim);color:#06140D;font-weight:600}
.modebtn.warn[aria-pressed="true"]{background:var(--amber);color:#2A1A05}

.adminpanel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--yellow-bg);padding:34px clamp(20px,4vw,64px);overflow-y:auto}
.adminpanel[hidden]{display:none}
.adminpanel h3{margin:0 auto 22px;max-width:820px;width:100%;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--yellow-ink);text-transform:uppercase;opacity:.75}
.admin-row{flex:1;display:flex;flex-direction:column;gap:24px;max-width:820px;margin:0 auto;width:100%}
.admin-col{display:flex;flex-direction:column;background:var(--yellow-card);border:1px solid var(--yellow-line);border-radius:14px;padding:22px}
.admin-col .col-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--yellow-ink);text-transform:uppercase;opacity:.65;margin-bottom:14px}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--yellow-dash);border-radius:10px;padding:20px;text-align:center;font-family:var(--sans);font-size:14px;color:var(--yellow-ink);cursor:pointer;background:rgba(0,0,0,.05);min-height:260px}
.dropzone:hover,.dropzone.over{border-color:var(--yellow-ink);background:rgba(0,0,0,.09)}
.dropzone .big{font-size:44px;line-height:1}
.dropzone input{display:none}
.admin-note{justify-content:flex-start}
.admin-note textarea{flex:1;width:100%;min-height:180px;padding:12px 14px;background:#FFFDF3;border:1px solid var(--yellow-line);border-radius:8px;color:#2B2205;font-family:var(--sans);font-size:14px;resize:vertical}
.admin-note input.title{width:100%;padding:9px 12px;background:#FFFDF3;border:1px solid var(--yellow-line);border-radius:8px;color:#2B2205;font-family:var(--sans);font-size:13px;margin-bottom:10px}
.admin-note button,.admin-list button.up{margin-top:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#FFF6D6;background:var(--yellow-btn);border:0;border-radius:7px;padding:9px 16px;align-self:flex-start;cursor:pointer}
.admin-note button:hover,.admin-list button.up:hover{opacity:.85}
.admin-status{font-family:var(--mono);font-size:11px;color:var(--yellow-ink);opacity:.75;margin-top:10px;white-space:pre-wrap}
.admin-status.ok{color:#1B6B3A;opacity:1}
.admin-status.err{color:#A32424;opacity:1}
.admin-list{display:none}
.stopgen{font-family:var(--mono);font-size:10.5px;color:var(--amber);border:1px solid rgba(224,164,88,.4);border-radius:5px;padding:5px 10px;background:var(--amber-bg);cursor:pointer}
.caret{display:inline-block;width:7px;height:14px;background:var(--green);vertical-align:-2px;margin-left:2px;animation:blink .9s steps(1) infinite}
.ai-body p{margin:0 0 9px}
.ai-body pre{font-family:var(--mono);font-size:12.5px;background:var(--block);border:1px solid var(--line);border-left:2px solid var(--green-dim);border-radius:0 5px 5px 0;padding:10px 13px;margin:10px 0;overflow-x:auto;white-space:pre-wrap;color:#8FE9BC}

.stream{flex:1;overflow-y:auto;padding:24px 26px 10px;scroll-behavior:smooth}
.wrap{max-width:900px;margin:0 auto}

/* ---- turnos ---- */
.turn{margin-bottom:30px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.who{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:3px}
.who.qa{background:rgba(63,214,138,.14);color:var(--green)}
.who.me{background:var(--blue);color:#9FC7EE}
.time{font-family:var(--mono);font-size:11px;color:var(--dim-2)}
.state{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;margin-left:auto;color:var(--dim-2)}
.state.warn{color:var(--amber)}

.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;font-size:15px;color:var(--text-hi);max-width:640px}
.block{background:var(--block);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-top:9px;font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--text);max-width:760px}
.block>*:first-child{margin-top:0}
.block>*:last-child{margin-bottom:0}
.src{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);margin-top:9px;letter-spacing:.03em}
.src b{color:var(--dim);font-weight:400}

.turn.me{display:flex;flex-direction:column;align-items:flex-end}
.turn.me .meta{justify-content:flex-end}
.bubble{background:var(--blue);border:1px solid var(--blue-hi);border-radius:8px;padding:12px 18px;color:#DCEBFA;font-family:var(--mono);font-size:14px;max-width:70%}

/* ---- contenido dentro de .block ---- */
.block h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--green-dim);margin:20px 0 9px;font-weight:600}
.block p{margin:0 0 10px;font-family:var(--sans);font-size:14px;line-height:1.65;color:var(--text)}
.block ul,.block ol{margin:0 0 12px;padding-left:22px}
.block li{margin-bottom:6px}
.block ul.arrow{list-style:none;padding-left:0}
.block ul.arrow>li{padding-left:22px;position:relative}
.block ul.arrow>li::before{content:"→";position:absolute;left:0;color:var(--green)}
.block ol{counter-reset:s;list-style:none;padding-left:0}
.block ol>li{padding-left:26px;position:relative;counter-increment:s}
.block ol>li::before{content:counter(s,decimal-leading-zero) ".";position:absolute;left:0;color:var(--green-dim);font-size:12px}
.block ol.chk,.block ul.chk{list-style:none;padding-left:0;counter-reset:s}
.block .chk>li{padding-left:26px;position:relative}
.block .chk>li::before{content:"[ ]";position:absolute;left:0;color:var(--dim-2);font-size:12px}
code{font-family:var(--mono);font-size:12.5px;background:rgba(63,214,138,.08);border:1px solid rgba(63,214,138,.16);color:#8FE9BC;padding:1px 6px;border-radius:3px;white-space:nowrap}
kbd{font-family:var(--mono);font-size:12px;background:#1B2833;border:1px solid #2C3D4C;border-bottom-width:2px;color:var(--text-hi);padding:1px 6px;border-radius:3px}
.note{border-left:2px solid var(--amber);background:var(--amber-bg);padding:11px 14px;margin:13px 0;border-radius:0 5px 5px 0}
.note b{color:var(--amber)}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim-2);line-height:1.6}
a{color:#6FB3F0;text-decoration:none;border-bottom:1px solid rgba(111,179,240,.3);word-break:break-all}
a:hover{border-bottom-color:#6FB3F0}
table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim-2);border-bottom:1px solid var(--line);padding:7px 10px 7px 0;font-weight:500}
td{border-bottom:1px solid var(--line-soft);padding:7px 10px 7px 0;vertical-align:top;font-family:var(--sans);font-size:13.5px}
td.m{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:#8FE9BC}
.tbl-scroll{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.tbl-scroll table{margin:0}
.tbl-scroll th{position:sticky;top:0;background:#101A22;padding:8px 10px;z-index:1}
.tbl-scroll td{padding:7px 10px}
.credbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 12px}
.reveal{font-family:var(--mono);font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:6px 12px;background:var(--block)}
.reveal:hover{border-color:var(--green-dim);color:var(--green)}
.reveal[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(224,164,88,.07)}
.cred{cursor:pointer;position:relative;display:inline-block}
.cred:hover .pw-real,.cred:hover .pw-mask{color:var(--green)}
.pw-mask{color:var(--dim-2);letter-spacing:.12em}
.pw-real{color:#8FE9BC}
.copied{position:absolute;left:calc(100% + 8px);top:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--green);text-transform:uppercase}
.finder{margin:12px 0 4px}
.finder input{width:100%;padding:9px 12px;background:#0B1219;border:1px solid var(--line);border-radius:5px;color:var(--text-hi);font-family:var(--mono);font-size:13px}
.finder input:focus{outline:none;border-color:var(--green-dim)}
.finder input::placeholder{color:var(--dim-2)}

.followups{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;max-width:760px}
.fu{font-family:var(--mono);font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:6px 11px;background:var(--block)}
.fu:hover{border-color:var(--green-dim);color:var(--green)}
.fu::before{content:"› ";color:var(--green-dim)}

/* ================= COMPOSER ================= */
.composer{border-top:1px solid var(--line);padding:16px 26px 14px}
.inputrow{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 16px}
.inputrow:focus-within{border-color:var(--green-dim)}
.prompt{font-family:var(--mono);font-size:14px;color:var(--green)}
#q{flex:1;background:none;border:0;padding:13px 0;color:var(--text-hi);font-family:var(--sans);font-size:14.5px}
#q:focus{outline:none}
#q::placeholder{color:var(--dim-2)}
.send{width:42px;height:38px;border:1px solid var(--line);border-radius:6px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.send:hover{border-color:var(--green-dim);color:var(--green)}
.chips{max-width:900px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:6px 12px;background:var(--block)}
.chip:hover{border-color:var(--green-dim);color:var(--green)}
.chip[aria-current="true"]{border-color:var(--green-dim);color:var(--green);background:rgba(63,214,138,.07)}
.chips .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim-2);margin-right:2px}

.help{position:fixed;right:22px;bottom:20px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--dim);font-family:var(--mono);font-size:15px;display:flex;align-items:center;justify-content:center;z-index:20}
.help:hover{border-color:var(--green-dim);color:var(--green)}

/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#1E2A36;border-radius:5px}
*::-webkit-scrollbar-thumb:hover{background:#2A3946}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .22s ease}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:29;display:none}
  .scrim.on{display:block}
  .stream,.composer,.bar{padding-left:14px;padding-right:14px}
  .bubble{max-width:85%}
  .bar .count{display:none}
  .bar{flex-wrap:wrap;row-gap:10px}
  .bar .aigroup{width:100%;margin-left:0;flex-wrap:wrap}
  .help{bottom:auto;top:14px;right:14px;width:32px;height:32px;font-size:13px}
}
@media (min-width:901px){.burger{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">

  <aside class="side" id="side">
    <div class="side-head">
      <div class="logo"><span class="pulse"></span>REPOSITORIO QA</div>
      <div class="ver">v0.1 — MVP · QA INTERNAL</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">EQUIPO QA · SOPORTE INTERNO</div>
  </aside>

  <div class="main">
    <div class="bar">
      <button class="burger" id="burger" aria-label="Abrir módulos">☰</button>
      <div class="where" id="where"><span class="k">00_</span> Inicio</div>
      <div class="aigroup">
        <span class="aistate" id="aistate" data-s="iniciando" title="Estado del modelo local">
          <span class="dot"></span><span id="aistatetxt">IA LOCAL · INICIANDO</span>
        </span>
        <button class="aitoggle" id="aitoggle" aria-pressed="true"
                title="Cuando está activa, la IA local responde toda consulta escrita usando como contexto toda la documentación de la página">IA ON</button>
        <div class="modeswitch" role="group" aria-label="Modo">
          <button class="modebtn" id="modeChat" aria-pressed="true">CHAT</button>
          <button class="modebtn warn" id="modeAdmin" aria-pressed="false">ADMINISTRADOR</button>
        </div>
        <div class="count" id="count">0 mensajes</div>
      </div>
    </div>

    <div class="adminpanel" id="adminPanel" hidden>
      <h3>Modo administrador — actualizar la base de conocimiento</h3>
      <div class="admin-row">
        <div class="admin-col">
          <div class="col-title">Subir documento</div>
          <label class="dropzone" id="dropzone" for="adminFile">
            <span class="big">📎</span>
            Arrastra un archivo aquí o haz clic para elegirlo<br>
            <span style="opacity:.7">foto, pdf, docx, xlsx, pptx, txt o zip</span>
            <input type="file" id="adminFile"
                   accept=".pdf,.docx,.xlsx,.xlsm,.pptx,.txt,.csv,.zip,.png,.jpg,.jpeg,.bmp,.tif,.tiff,.webp">
          </label>
          <div class="admin-status" id="uploadStatus"></div>
        </div>
        <div class="admin-col admin-note">
          <div class="col-title">Escribir directamente</div>
          <input class="title" id="noteTitle" placeholder="Título de la nota (opcional)">
          <textarea id="noteText" placeholder="Escribe aquí la información a agregar/actualizar..."></textarea>
          <button class="up" id="noteSave">Guardar como conocimiento</button>
          <div class="admin-status" id="noteStatus"></div>
        </div>
      </div>
      <div class="admin-list" id="adminList"></div>
    </div>

    <div class="stream" id="stream"><div class="wrap" id="wrap"></div></div>

    <div class="composer">
      <div class="inputrow">
        <span class="prompt">&gt;_</span>
        <input id="q" autocomplete="off" placeholder="Escribe tu consulta o presiona una opción del menú...">
        <button class="send" id="send" aria-label="Enviar">→</button>
      </div>
      <div class="chips" id="chips"><span class="lbl">ACCESO RÁPIDO</span></div>
    </div>
  </div>

    return `<tr><td>${esc(l.n)}</td><td>${u}</td><td class="m">${l.user?esc(l.user):'—'}</td><td class="m">${cred}</td></tr>`;
  }).join("");
}
function linksTable(list){
  list = list || DATA.links;
  return `<div class="credbar">
      <button class="reveal" id="revealpw" aria-pressed="false">Mostrar credenciales</button>
      <span class="hint" id="linkscount">${DATA.links.filter(l=>l.pw).length} de ${DATA.links.length} accesos tienen credencial registrada</span>
    </div>
    <div class="finder"><input id="linksq" placeholder="Filtrar por nombre de servicio, ej.: bduc, websphere, saraweb…" autocomplete="off"></div>
    <div class="tbl-scroll"><table><thead><tr><th>Servicio</th><th>Enlace</th><th>Usuario</th><th>Clave</th></tr></thead><tbody id="linksbody">${linksRows(list)}</tbody></table></div>`;
}
// Palabras genéricas de la pregunta que NO sirven para filtrar por nombre de
// servicio (si las dejamos, "link de bduc" filtraría también por "link").
const LINK_GENERIC = new Set(["link","links","enlace","enlaces","acceso","accesos",
  "url","urls","pagina","portal","dame","dime","cual","cuales","muestra",
  "muestrame","necesito","quiero","dile","el","la","los","las","de","del"]);
function guessLinkFilter(q){
  return tokens(q||"").filter(t=>!LINK_GENERIC.has(t)).join(" ");
}
let LAST_QUERY = "";
function wireCreds(root){ wireLinksTable(root); }
function wireLinksTable(root){
  const btn = root.querySelector('#revealpw'); if(!btn) return;
  const body = root.querySelector('#linksbody'), cnt = root.querySelector('#linkscount'), inp = root.querySelector('#linksq');
  let on=false;
  const applyReveal=()=>{
    root.querySelectorAll('.pw-mask').forEach(e=>e.hidden=on);
    root.querySelectorAll('.pw-real').forEach(e=>e.hidden=!on);
  };
  btn.onclick=()=>{
    on=!on;
    btn.textContent = on ? 'Ocultar credenciales' : 'Mostrar credenciales';
    btn.setAttribute('aria-pressed', on?'true':'false');
    applyReveal();
  };
  // Delegación de eventos en la tabla: los renglones se reemplazan al
  // filtrar, así que escuchar en el contenedor evita perder el clic-para-copiar.
  body.addEventListener('click', e=>{
    const c = e.target.closest('.cred'); if(!c) return;
    const v = c.dataset.pw;
    if(navigator.clipboard) navigator.clipboard.writeText(v).then(()=>{
      const p=document.createElement('span'); p.className='copied'; p.textContent='copiado';
      c.appendChild(p); setTimeout(()=>p.remove(),1200);
    });
  });
  const runFilter=(term)=>{
    const q = norm(term).trim();
    const list = q ? DATA.links.filter(l=>norm(l.n).includes(q)) : DATA.links;
    body.innerHTML = linksRows(list);
    cnt.textContent = q
      ? `${list.length} coincidencia(s) para "${term.trim()}"`
      : `${DATA.links.filter(l=>l.pw).length} de ${DATA.links.length} accesos tienen credencial registrada`;
    applyReveal();
  };
  inp.addEventListener('input', ()=>runFilter(inp.value));
  // Si la pregunta que trajo hasta esta ficha menciona un servicio puntual
  // ("link de bduc"), filtramos de una vez en vez de mostrar los 30 links.
  if(LAST_QUERY){
    const guess = guessLinkFilter(LAST_QUERY);
    if(guess && DATA.links.some(l=>norm(l.n).includes(norm(guess)))){
      inp.value = guess;
      runFilter(guess);
    }
  }
  LAST_QUERY = "";
}
function trxRows(list){
  return list.map(t=>`<tr>
    <td class="m"><b>${esc(t.t)}</b></td>
    <td>${esc(t.d)}<div class="hint">${esc(t.b)}${t.host?' · HOST '+esc(t.host):''}${t.open?' · '+esc(t.open):''}${t.imp?' · Impacto '+esc(t.imp):''}</div></td>
    <td>${t.req?esc(t.req):'—'}</td></tr>`).join("");
}
function trxTable(list){
  return `<div class="tbl-scroll"><table><thead><tr><th>TXN</th><th>Transacción</th><th>Requisitos</th></tr></thead><tbody>${trxRows(list)}</tbody></table></div>`;
}

{
 id:"06.2", mod:"06", title:"Reiniciar el CCICSFOR",
 src:"GUÍA PARA EL INICIO DE DÍA.docx",
 kw:["reiniciar cicsfor","ccicsfor","bajar cics","subir cics","cemt p shut","sd.st","pre cic","que hace pre cic","comando pre cic","para que sirve pre cic","listar cics","jesmsglg","tareas pendientes","execution","reinicio for","se cayo algo","se me cayo algo","no se que hacer","algo no funciona","no funciona nada","esta caido","no responde"],
 body:()=>`<ol>
  <li>Entrar al <b>TSO</b> (por emulación o por Personal) e ingresar credenciales</li>
  <li>Escribir <code>sd.st</code></li>
  <li>Listar todos los CICS: <code>pre *cic*</code></li>
  <li>Bajar el CICS: <code>cemt p shut i</code>. Si no funciona, bajarlo forzado: <code>/c ccicsfor</code></li>
  <li>Subir el CICS: <code>/s ccicsfor</code> — verificar que el QUEUE de CCICSFOR diga <b>EXECUTION</b></li>
  <li>Doble Enter</li>
  <li>Escribir <code>?</code> al frente del CCICSFOR</li>
  <li>Escribir <code>s</code> frente a <code>JESMSGLG</code></li>
  <li>Escribir <code>bot</code> para ir al fondo</li>
  <li>Eliminar tareas pendientes: <code>/&lt;número&gt;,go</code> — ejemplo: <code>/36,go</code></li>
 </ol>`,

},
{
 id:"06.3", mod:"06", title:"Reiniciar CICS TP, TP1 y TP2 + levantar TOLD",
 src:"GUÍA PARA EL INICIO DE DÍA.docx",
 kw:["reiniciar tp","ccicstp","ccicstp1","ccicstp2","cold","levantar told","subida de sistema","dg00","administrador de recursos","dbdccics","dbdccic1","dbdccic2","given","consulta estado sistema","bajar tp"],
 body:()=>`<h4>1. Bajar y subir los CICS desde el TSO</h4>
 <p>Ingresar al TSO (Personal: <code>TSO</code> · Emulación: <code>LOGON APPLID(TSO)</code>), luego <code>SD.ST</code> y <code>PRE *CIC*</code>.</p>
 <table><thead><tr><th>Acción</th><th>Comando</th></tr></thead><tbody>
  <tr><td>Bajar TP</td><td class="m">/C CCICSTP</td></tr>
  <tr><td>Bajar TP1</td><td class="m">/C CCICSTP1</td></tr>
  <tr><td>Bajar TP2</td><td class="m">/C CCICSTP2</td></tr>
  <tr><td>Levantar TP</td><td class="m">/S CCICSTP,M=COLD</td></tr>
  <tr><td>Levantar TP1</td><td class="m">/S CCICSTP1</td></tr>
  <tr><td>Levantar TP2</td><td class="m">/S CCICSTP2</td></tr>
 </tbody></table>
 <div class="note"><b>Confirmaciones pendientes:</b> en los 3 TP hay tareas que piden confirmación (aparecen con <code>@</code> y un número).
 <ol style="margin:8px 0 0">
  <li><code>?</code> al lado del CICS -> <code>S</code> al lado de <code>JESMSGLG</code></li>
  <li>Ir al final con <code>BOT</code> (o tecla M + <kbd>F8</kbd>) y buscar <code>@</code></li>
  <li>Eliminar con <code>/&lt;número&gt;,go</code> — ejemplo <code>/82,go</code></li>
  <li>Verificar con <code>f GIVEN</code>: si aparece <i>Control is being given to CICS</i>, ya no hay pendientes</li>
 </ol>
 A veces el nuevo <code>@</code> demora: dale varias veces Enter.</div>
 <h4>2. Levantar el TOLD en TP, TP1 y TP2</h4>
 <table><thead><tr><th>CICS</th><th>Por Personal</th><th>Por Emulación</th></tr></thead><tbody>
  <tr><td class="m">CICSTP</td><td class="m">DBDCCICS</td><td class="m">CCICSTP</td></tr>
  <tr><td class="m">CICSTP1</td><td class="m">DBDCCIC1</td><td class="m">LOGON APPLID(DBDCCIC1)</td></tr>
  <tr><td class="m">CICSTP2</td><td class="m">DBDCCIC2</td><td class="m">LOGON APPLID(DBDCCIC2)</td></tr>
 </tbody></table>
 <ul class="arrow">
  <li>En cada CICS escribir la tx <code>DG00</code> y Enter</li>
  <li>Marcar <b>Administrador de Recursos</b> y Enter</li>
  <li>Marcar <b>Subida de Sistema</b> y <kbd>F4</kbd></li>
  <li>Verificar con <b>Consulta Estado Sistema</b>: la <i>Fecha Actual</i> y la <i>Start Up en Fecha</i> deben coincidir</li>
 </ul>
 <p class="hint">DBDCCIC1 corresponde a Agentes Corresponsales.</p>`,
 fu:["¿Cómo abro las bases con ABREBASE?","¿Qué es la región AOR?"]
},

/* ================= 07 HOST ================= */
{
 id:"07.1", mod:"07", title:"ROSCOE / RJE — fundamentos y términos", primary:true,
 src:"07_Guía ROSCOE.docx",
 kw:["roscoe","rje","que es roscoe","aws","active work space","acid","savaws","prefijo","miembro","member","dataset","biblioteca","jcl que es","job","attach job monitor","modo nativo","terminos"],
 body:()=>`<p><b>ROSCOE</b> (Remote Operating System Conversational Environment) permite acceder y gestionar recursos del mainframe. Con <b>RJE</b> (Remote Job Entry) se envían jobs, se monitorea su ejecución y se consultan resultados.</p>
 <table><thead><tr><th>Término</th><th>Descripción</th></tr></thead><tbody>
  <tr><td class="m">AWS</td><td>Active Work Space: área de trabajo <b>temporal</b> que se abre al iniciar sesión. Máximo 4000 líneas. Lo que solo está en el AWS se pierde si no se guarda.</td></tr>
  <tr><td class="m">Miembro</td><td>Archivo individual dentro de una biblioteca particionada: datos, programas, JCL o texto. El nombre debe empezar con letra.</td></tr>
  <tr><td class="m">JCL</td><td>Job Control Language: define trabajos y recursos.</td></tr>
  <tr><td class="m">ACID</td><td>Accessor ID: tu identificador de usuario (normalmente el mismo de CICS).</td></tr>
  <tr><td class="m">SAVAWS</td><td>Seguridad: al cerrar una pantalla dividida con datos o si el sistema cae, ROSCOE guarda el AWS como SAVAWS01…SAVAWS99.</td></tr>
  <tr><td class="m">Prefijo</td><td>Identificador de cuenta ROSCOE. Sirve para traer miembros compartidos, ej. <code>F LU.ROSCTST2</code>.</td></tr>
  <tr><td class="m">Modo nativo</td><td>Comandos directos fuera de los menús RJE. Se entra presionando <kbd>CLEAR</kbd>.</td></tr>
 </tbody></table>
 <h4>Estados de un job</h4>
 <ul class="arrow"><li><b>Input</b> — en cola</li><li><b>Active</b> — en ejecución</li><li><b>Output</b> — finalizado correctamente</li><li><b>Abend</b> — finalizado con error</li></ul>`,
 fu:["¿Cuáles son los comandos de modo nativo?","¿Cómo ejecuto un JCL?","¿Qué son los line commands?"]
},
{
 id:"07.2", mod:"07", title:"Comandos de modo nativo",
 src:"07_Guía ROSCOE.docx",
 kw:["comandos nativos","fetch","attach","save","update","del","set display numx","copy","traer miembro","guardar miembro","comandos basicos host","comandos roscoe"],
 body:()=>`<p>Se escriben en el área de comandos, en la parte superior. Para usarlos hay que salir de RJE con <kbd>CLEAR</kbd>.</p>
 <table><thead><tr><th>Comando</th><th>Para qué sirve</th></tr></thead><tbody>
  <tr><td class="m">F (FETCH)</td><td>Trae una copia de un miembro al AWS. Ej. <code>F ROSLAB1</code>. Con prefijo trae compartidos: <code>F LU.ROSCTST2</code> (solo si el miembro es 'S' Shared).</td></tr>
  <tr><td class="m">A (ATTACH)</td><td>Muestra el contenido del AWS. También reposiciona: <code>A 18,,</code> muestra desde la línea 18; <code>A 1,,</code> vuelve al inicio.</td></tr>
  <tr><td class="m">&amp;</td><td>Encadena dos comandos: <code>F LU.ROSCTST2 &amp; A</code></td></tr>
  <tr><td class="m">S (SAVE)</td><td>Guarda el AWS como miembro <b>nuevo</b>. Ej. <code>S ROSLAB2 /2ND ROSCOE EXERCISE/</code> — el texto entre barras queda como descripción.</td></tr>
  <tr><td class="m">U (UPDATE)</td><td>Actualiza un miembro <b>existente</b>. Ej. <code>U ROSLAB2</code>. Con <code>U *</code> actualiza el miembro mostrado.</td></tr>
  <tr><td class="m">DEL</td><td>Vacía el AWS (no borra el miembro guardado).</td></tr>
  <tr><td class="m">SET DISPLAY NUMX</td><td>Permite escribir sobre los números de línea para usar line commands.</td></tr>
  <tr><td class="m">COPY</td><td>Copia líneas de un miembro a otro usando números de línea.</td></tr>
 </tbody></table>
 <h4>Otros comandos de edición</h4>
 <table><tbody>
  <tr><td class="m">e 'preca'creca'</td><td>Editar / reemplazar texto</td></tr>
  <tr><td class="m">save recad00</td><td>Guardar</td></tr>
  <tr><td class="m">u*</td><td>Guardar sobre una modificación</td></tr>
  <tr><td class="m">r 1 1</td><td>Ordenar líneas</td></tr>
  <tr><td class="m">i5</td><td>Agregar 5 líneas</td></tr>
  <tr><td class="m">r2</td><td>Agregar 2 líneas copiadas</td></tr>
  <tr><td class="m">d / dd / db</td><td>Eliminar línea / bloque / desde el punto hasta el final</td></tr>
  <tr><td class="m">lc</td><td>Cambiar toda la línea a minúscula</td></tr>
  <tr><td class="m">set mode x / set mode b</td><td>Escribir en minúscula / mayúscula</td></tr>
 </tbody></table>
 <div class="note">Antes de <kbd>PF6</kbd>: guarda con SAVE o UPDATE, o vacía el AWS con DEL, para no generar miembros SAVAWS innecesarios.</div>`,
 fu:["¿Qué son los line commands?","¿Cómo ejecuto un JCL?"]
},
{
 id:"07.3", mod:"07", title:"Line commands y teclas de función",
 src:"07_Guía ROSCOE.docx",
 kw:["line commands","comandos de linea","insertar linea","copiar linea","mover linea","borrar linea","cc","mm","dd","destinos","tt","bb","teclas pf","3270","f8","f3","teclas de funcion","pantalla dividida","split"],
 body:()=>`<h4>Line commands</h4>
 <table><thead><tr><th>Cmd</th><th>Acción</th></tr></thead><tbody>
  <tr><td class="m">I</td><td>Insertar línea en blanco debajo del cursor. <code>I2</code>, <code>I5</code>, <code>I10</code> abren varias. Si no escribes nada, ROSCOE la cierra sola.</td></tr>
  <tr><td class="m">C / CC…CC</td><td>Copiar una línea / un bloque contiguo, más el destino</td></tr>
  <tr><td class="m">M / MM…MM</td><td>Mover una línea / un bloque</td></tr>
  <tr><td class="m">D / DD…DD</td><td>Borrar una línea / un bloque</td></tr>
  <tr><td class="m">E / B / R</td><td>Editar / examinar / renombrar un miembro</td></tr>
 </tbody></table>
 <h4>Destinos para copiar o mover</h4>
 <table><tbody>
  <tr><td class="m">A</td><td>After — después de esta línea</td></tr>
  <tr><td class="m">B</td><td>Before — antes de esta línea</td></tr>
  <tr><td class="m">TT</td><td>Al inicio del AWS</td></tr>
  <tr><td class="m">BB</td><td>Al final del AWS</td></tr>
 </tbody></table>
 <div class="note">Los cambios solo afectan la copia en tu AWS. Para conservarlos usa SAVE (miembro nuevo) o UPDATE (existente). <b>No puedes actualizar miembros de la biblioteca de otra cuenta:</b> guárdalos como miembro nuevo en la tuya.</div>
 <h4>Teclas PF en modo nativo y edición</h4>
 <table><tbody>
  <tr><td class="m">PF1</td><td>Avanzar una página</td></tr>
  <tr><td class="m">PF2</td><td>Retroceder una página</td></tr>
  <tr><td class="m">PF3</td><td>Dividir la pantalla en dos AWS (split screen)</td></tr>
  <tr><td class="m">PF4</td><td>Ir al final (BOTTOM)</td></tr>
  <tr><td class="m">PF5</td><td>Ir al inicio (TOP)</td></tr>
  <tr><td class="m">PF6</td><td>Salir de la pantalla dividida (guarda como SAVAWS si no está vacío)</td></tr>
 </tbody></table>
 <p class="hint">Las teclas PF cambian según dónde estés: al editar, PF1 avanza página; en el menú RJE, PF1 entra a INPUT/REVISE.</p>
 <h4>Teclas 3270 generales</h4>
 <ul class="arrow"><li>PF1 ayuda · PF3 salir o regresar · PF7 subir · PF8 bajar · PF9 intercambiar pantallas · PF12 cancelar · Enter confirmar</li></ul>`,
 fu:["¿Cómo ejecuto un JCL?","¿Qué es el AWS?"]
},
{

 kw:["ejecutar jcl","como ejecuto","sub","submit","aj","spool","dis a","dis","job monitor","monitorear job","ver salida","numero de job","estado del job","enviar job"],
 body:()=>`<h4>Flujo</h4>
 <ol>

 after:(root)=>{
   const inp = root.querySelector('#trxq'), out = root.querySelector('#trxout'), cnt = root.querySelector('#trxcount');
   inp.addEventListener('input',()=>{
     const q = norm(inp.value).trim();
     if(!q){ out.innerHTML = trxTable(DATA.trx.slice(0,40)); cnt.textContent = `Mostrando las primeras 40 de ${DATA.trx.length}.`; return; }
     const r = DATA.trx.filter(t => t.t.includes(q) || norm(t.d).includes(q) || norm(t.b).includes(q));

     cnt.textContent = r.length ? `${r.length} coincidencia(s).` : "";

/* =========================================================
   MOTOR DE BÚSQUEDA
   ========================================================= */
const STOP = new Set(["que","como","cual","cuales","donde","cuando","para","por","con","los","las","del","una","uno","unos","unas","este","esta","esto","hacer","hago","hace","tengo","puedo","porfa","favor","quiero","necesito","dime","muestrame","explicame","sobre","the","and",
  // sincronizado con _QUERY_STOPWORDS de server.py: sin esto, una ficha con
  // "inicio de dia" en sus keywords le gana a la ficha correcta con
  // cualquier pregunta que mencione "día", así sea sobre otro tema.
  "de","la","el","en","un","y","o","al","es","su","sus","se","lo","si","no",
  "mas","estos","estas","ese","esa","ya","le","les","fue","son","ser","hay",
  "quien","me","mi","tu","te","he","ha","han","desde","hasta","porque",
  "dia","dias","muy"]);

function tokens(q){
  return norm(q).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2 && !STOP.has(w));
}

function wordSet(s){
  return new Set(s.split(/[^a-z0-9ñ]+/).filter(Boolean));
}

function score(entry,q,toks){
  let s=0;
  const nq = norm(q);
  const nqWords = wordSet(nq);
  const nt = norm(entry.title);
  const matched = new Set();
  const kw = entry.kw||[];
  // Igual que en el servidor: una ficha con cientos de "keywords" (típico de
  // OCR ruidoso de una captura de pantalla) no debe ganarle a una ficha
  // chica y precisa solo por volumen — se diluye el aporte de cada match.
  const dampen = Math.min(1, 25/(kw.length||1));
  for(const k of kw){
    const nk = norm(k);
    if(!nk || nk.length<=2 || STOP.has(nk)) continue;
    const isPhrase = nk.includes(" ");
    // Coincidencia por PALABRA COMPLETA, no por substring: si no, una
    // keyword corta como "cuenta" hace match dentro de "cuentame" y trae
    // fichas que no tienen nada que ver con la pregunta.
    const hit = isPhrase ? nq.includes(nk) : nqWords.has(nk);
    if(hit){
      s += 9 * (isPhrase ? 1 : dampen);
      toks.forEach(t=>{ if(nk.includes(t)||t.includes(nk)) matched.add(t); });
    }
  }
  for(const t of toks) if(t.length>=3 && nt.includes(t)){ s += 8; matched.add(t); }
  // Igual que en el servidor: premia cubrir varias palabras distintas de la
  // pregunta, no solo una en común, para no confundir fichas por 1 palabra suelta.
  if(toks.length >= 2) s += 6 * Math.max(0, matched.size - 1);
  if(entry.primary) s += 1;
  if(!entry._admin) s *= 1.25; // fichas curadas a mano > texto crudo de ingesta
  return s;
}

function answer(q){
  const toks = tokens(q);
  const ranked = KB.map(e=>({e,s:score(e,q,toks)})).sort((a,b)=>b.s-a.s);
  const top = ranked[0];

  // atajo: transacción por número de 4 dígitos
  const m = norm(q).match(/\b(\d{4})\b/);
  let txnHits = null, txn = null;
  if(m){
    txn = m[1];
    const hits = DATA.trx.filter(t=>t.t===txn);
    if(hits.length) txnHits = hits;
  }
  // el número gana salvo que haya una ficha claramente más específica
  if(txnHits && (top.e.id === "10.1" || !(top && top.s >= 14 && toks.length >= 2))) return {type:"trx", txn, hits:txnHits};

  if(!top || top.s < 8){
    if(txnHits) return {type:"trx", txn, hits:txnHits};
    return {type:"none"};
  }
  const also = ranked.slice(1,4).filter(r=>r.s >= top.s*0.55 && r.s>=8).map(r=>r.e);
  return {type:"kb", entry:top.e, also, txn: txnHits?txn:null};
}

/* =========================================================
   IA LOCAL (Ollama) — capa conversacional sobre TODA la página

   El contexto ya NO se arma aquí ni se manda en cada pregunta.
   server.py lee este mismo HTML al arrancar, extrae los 11
   módulos, las 35 fichas y las 387 transacciones, y los deja
   fijos en el prompt del modelo — así Ollama reutiliza su caché
   y no reprocesa 10.000 tokens en cada consulta. Desde aquí solo
   viaja la pregunta y el historial reciente, y la respuesta
   vuelve en streaming (token a token), por lo que la interfaz
   nunca se queda colgada esperando.

   El módulo 01 (enlaces y credenciales) sigue EXCLUIDO del
   contexto que ve el modelo, igual que antes.
   ========================================================= */
const AI = {
  on: true,
  direct: false,     // módulo 12: conversación directa, sin fichas automáticas
  state: 'iniciando',
  history: [],       // memoria conversacional (últimos turnos)
  ctrl: null         // AbortController de la generación en curso
};

const aiStateEl  = document.getElementById('aistate');
const aiStateTxt = document.getElementById('aistatetxt');
const aiToggle   = document.getElementById('aitoggle');

const AI_LABEL = {
  iniciando:'IA LOCAL · INICIANDO',
  calentando:'IA LOCAL · CALENTANDO',
  listo:'IA LOCAL · LISTA',
  generando:'IA LOCAL · RESPONDIENDO',
  error:'IA LOCAL · SIN CONEXIÓN',
  apagada:'IA LOCAL · APAGADA'
};

function setAIState(s, detail){
  AI.state = s;
  aiStateEl.dataset.s = (s==='generando') ? 'listo' : s;
  aiStateTxt.textContent = AI_LABEL[s] || s.toUpperCase();
  aiStateEl.title = detail || 'Estado del modelo local';
}

/* --- vigilancia del backend: el estado siempre visible en la barra --- */
async function pollHealth(){
  try{
    const r = await fetch('/api/health',{cache:'no-store'});
    const h = await r.json();
    if(AI.state!=='generando') setAIState(AI.on ? h.state : 'apagada', h.detail);
    AI.kb = h.kb;
    return h;
  }catch(err){
    if(AI.state!=='generando')
      setAIState('error','No hay respuesta de server.py. Ejecuta: python server.py');
    return null;
  }
}
(function healthLoop(){
  pollHealth().then(h=>setTimeout(healthLoop, (h && h.state==='listo') ? 30000 : 4000));
})();

/* --- markdown mínimo y seguro para la respuesta del modelo --- */
function mdLite(t){
  const pres = [];
  let s = String(t||'').replace(/```(?:[a-z]*)\n?([\s\S]*?)```/gi,(m,c)=>{
    pres.push(c.replace(/\s+$/,'')); return `
@@PRE${pres.length-1}@@
`;
  });
  s = esc(s)
      .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
      .replace(/`([^`\n]+)`/g,'<code>$1</code>');
  const out=[]; let li=null;
  for(const raw of s.split('\n')){
    const line = raw.trim();
    if(/^@@PRE\d+@@$/.test(line)){
      if(li){out.push(`<ul class="arrow">${li.join('')}</ul>`);li=null;}
      out.push(line); continue;
    }
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if(m){ (li=li||[]).push(`<li>${m[1]}</li>`); continue; }
    if(li){out.push(`<ul class="arrow">${li.join('')}</ul>`);li=null;}
    if(line) out.push(`<p>${line}</p>`);
  }
  if(li) out.push(`<ul class="arrow">${li.join('')}</ul>`);
  return out.join('').replace(/@@PRE(\d+)@@/g,(m,i)=>`<pre>${esc(pres[+i])}</pre>`);
}

/* --- la llamada: SSE por streaming, con memoria y reintento --- */
async function askLocalAI(q, opts){
  opts = opts || {};
  // si había una respuesta en curso, se cancela: una generación a la vez
  if(AI.ctrl) AI.ctrl.abort();
  const node = aiTurn(opts.lead || 'Respuesta de la IA local sobre la documentación del repositorio:');
  const body = node.querySelector('[data-r="body"]');
  const st   = node.querySelector('[data-r="st"]');

  AI.ctrl = new AbortController();
  const stop = stopButton(()=>{ if(AI.ctrl) AI.ctrl.abort(); });
  setAIState('generando');

  let acc = '', errored = null, retried = false;
  const paint = (final)=>{
    body.innerHTML = acc
      ? mdLite(acc) + (final?'':'<span class="caret"></span>')
      : `<p class="hint">${retried?'reconectando con la IA local':'consultando el modelo local'}<span class="caret"></span></p>`;
    stream.scrollTop = stream.scrollHeight;
  };

  try{
    const res = await fetch('/api/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, history: AI.history.slice(-6) }),
      signal: AI.ctrl.signal
    });
    if(!res.ok || !res.body) throw new Error('HTTP '+res.status);

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for(;;){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for(const p of parts){
        const line = p.split('\n').find(l=>l.startsWith('data: '));
        if(!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(6)); }catch(e){ continue; }

        if(ev.event==='start' && ev.warming){
          st.textContent = 'IA LOCAL · CALENTANDO';
          body.innerHTML = `<p class="hint">El modelo está cargando la documentación del repositorio por primera vez. Esto pasa una sola vez tras arrancar el servidor.<span class="caret"></span></p>`;
        }
        else if(ev.event==='retry'){ retried = true; paint(false); }
        else if(ev.event==='delta'){ acc += ev.text; paint(false); }
        else if(ev.event==='error'){ errored = ev.message; }
        else if(ev.event==='done'){
          if(ev.empty && !acc) errored = 'El modelo no devolvió texto.';
          if(ev.total_ms) node.dataset.ms = ev.total_ms;
        }
      }
    }
  }catch(err){
    if(err.name === 'AbortError'){
      st.textContent = 'IA LOCAL · DETENIDA';
      paint(true);
      if(acc) AI.history.push({role:'user',content:q},{role:'assistant',content:acc});
      stop.remove(); AI.ctrl = null; pollHealth();
      return;
    }
    errored = 'No hay conexión con el servidor local (server.py).';
  }

  stop.remove();
  AI.ctrl = null;

  if(errored && !acc){
    node.remove();
    botTurn({
      lead:'La IA local no está disponible ahora mismo:',
      html:`<p style="color:var(--amber)">${esc(errored)}</p>
        <p class="hint">Revisa: 1) que <code>python server.py</code> siga corriendo, 2) que Ollama responda (<code>ollama serve</code>), 3) que el modelo esté descargado (<code>ollama pull phi4-mini</code>).</p>
        <p class="hint">La búsqueda documental del repositorio sigue funcionando sin IA.</p>`,
      state:'warn'
    });
    if(!opts.hadKB) renderNone(q);
    setAIState('error', errored);
    return;
  }

  st.textContent = 'IA LOCAL · NO VERIFICADA';
  paint(true);
  body.insertAdjacentHTML('beforeend',
    `<div class="note"><b>Verifica antes de usar.</b> Esta respuesta la redactó el modelo local a partir de la documentación del repositorio; no es una ficha verificada. Si es información crítica, confírmala con un analista senior.</div>`);

  AI.history.push({role:'user',content:q},{role:'assistant',content:acc});
  if(AI.history.length > 12) AI.history = AI.history.slice(-12);
  setAIState('listo');
  stream.scrollTop = stream.scrollHeight;
}

/* =========================================================
   ENRUTADO DE CONSULTAS
   Con la IA activa, toda consulta escrita pasa por el modelo con
   TODA la página como contexto, y solo se muestra su respuesta ya
   redactada (la ficha cruda no se despliega: a veces trae texto de
   OCR desordenado de capturas de pantalla que confunde más de lo
   que ayuda). Excepción: módulo 01 (links/accesos), donde la ficha
   ya es la respuesta completa y no pasa por el modelo.
   Con la IA apagada se comporta como el buscador documental puro
   (ahí sí se muestra la ficha, porque es la única respuesta).
   ========================================================= */
function ask(text){
  const q=(text||'').trim(); if(!q) return;
  userTurn(q);
  LAST_QUERY = q;

  // Módulo 12: hablas solo con la IA. Nada de fichas ni tablas automáticas,
  // pero el modelo conserva toda la documentación y el hilo de la charla.
  if(AI.direct){
    if(!AI.on){ toggleAI(true); }
    askLocalAI(q,{hadKB:true, lead:'IA local — conversación directa:'});
    return;
  }

  const r=answer(q);

  // Búsqueda exacta por número de transacción: la tabla es la respuesta.
  if(r.type==='trx'){ renderTrx(r.txn,r.hits); return; }

  if(!AI.on){
    if(r.type==='kb') renderEntry(r.entry,r.also,r.txn);
    else renderNone(q);
    return;
  }

  if(r.type==='kb'){
    // Módulo 01 (links/accesos/credenciales): la ficha YA es la respuesta
    // completa y verificada. Dejar que la IA "comente" aquí solo agrega
    // riesgo de que mezcle contenido de otro documento — ya pasó una vez
    // (pidieron el link de BDUC y la IA citó un manual no relacionado).
    // Fichas cortas y exactas (comandos/links literales): pasarlas por la
    // IA solo agrega riesgo de que "parafrasee" y invente un comando o
    // sintaxis distinta a la real (pasó con Compare/Merge: la IA escribió
    // "compare <jcl1> <jcl2>" cuando el comando real es "compa"/"cermerge").
    // Fichas de definiciones/procedimientos precisos (comandos, regiones,
    // subsistemas): probado que un modelo de 1.5B las mezcla o inventa al
    // parafrasear (confundió TOR con AOR, e inventó que "pre *cic*" es un
    // comando SQL de transacciones). Se muestran tal cual, ya estan bien
    // escritas a mano.
    const EXACT_ENTRY_IDS = new Set(['01','02.2','02.3','02.4','02.5','02.6','04.1','05.1','05.2','06.1','06.2','06.3','06.4','07.1','09.1','09.2','11.0','11.3','11.4','11.5','11.6','11.7','11.8']);
    if(r.entry.mod === '01' || EXACT_ENTRY_IDS.has(r.entry.id)){
      renderEntry(r.entry,r.also,r.txn); return;
    }
    // Para el resto: no mostramos la ficha cruda (a veces trae texto de OCR
    // desordenado de capturas de pantalla) — solo la respuesta redactada
    // por la IA, que ya usa esa ficha como fuente.
    askLocalAI(q,{
      hadKB:true,
      lead:`Lectura de la IA local sobre la ficha ${r.entry.id} y el resto del repositorio:`
    });
  }else{
    askLocalAI(q,{
      hadKB:false,
      lead:'Sin ficha exacta en el repositorio. Respuesta de la IA local con toda la documentación cargada:'
    });
  }
}

  const main=entries.find(e=>e.primary)||entries[0];

  if(others.length) chipRow(others.map(o=>({label:cleanTitle(o.title),e:o})),it=>{userTurn(cleanTitle(it.e.title));renderEntry(it.e);});

}

}

const modeChatBtn=document.getElementById('modeChat'), modeAdminBtn=document.getElementById('modeAdmin');

const dropzone=document.getElementById('dropzone'), fileInput=document.getElementById('adminFile');
const uploadStatus=document.getElementById('uploadStatus');
['dragover','dragenter'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('over');}));
['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('over');}));
dropzone.addEventListener('drop',e=>{
  const f=e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) uploadFile(f);
});
fileInput.addEventListener('change',()=>{
  if(fileInput.files[0]) uploadFile(fileInput.files[0]);
});

async function uploadFile(file){
  uploadStatus.className='admin-status'; uploadStatus.textContent=`Subiendo ${file.name}…`;
  const fd=new FormData(); fd.append('file',file);
  try{
    const res=await fetch('/api/admin/upload',{method:'POST',body:fd});
    const data=await res.json();
    if(!res.ok || !data.ok){
      uploadStatus.className='admin-status err';
      uploadStatus.textContent='Error: '+(data.error||(data.warnings||[]).join('; ')||'no se pudo procesar');
    }else{
      let msg=`Listo: ${data.entries_added} ficha(s) agregadas desde "${data.filename}".`;
      if(data.warnings && data.warnings.length) msg+='\nAvisos: '+data.warnings.join('; ');
      if(!data.ocr_available) msg+='\n(OCR no disponible en este equipo para imágenes/PDF escaneados.)';
      uploadStatus.className='admin-status ok'; uploadStatus.textContent=msg;
      refreshAdminList();
      loadAdminKB();
    }
  }catch(e){
    uploadStatus.className='admin-status err'; uploadStatus.textContent='Error de red: '+e;
  }
  fileInput.value='';
}

const noteStatus=document.getElementById('noteStatus');
document.getElementById('noteSave').onclick=async()=>{
  const title=document.getElementById('noteTitle').value.trim();
  const text=document.getElementById('noteText').value.trim();
  if(!text){ noteStatus.className='admin-status err'; noteStatus.textContent='Escribe algo primero.'; return; }
  noteStatus.className='admin-status'; noteStatus.textContent='Guardando…';
  try{
    const res=await fetch('/api/admin/note',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,text})});
    const data=await res.json();
    if(!res.ok || !data.ok){ noteStatus.className='admin-status err'; noteStatus.textContent='Error: '+(data.error||'desconocido'); }
    else{
      noteStatus.className='admin-status ok'; noteStatus.textContent=`Guardado (${data.entries_added} ficha[s]).`;
      document.getElementById('noteTitle').value=''; document.getElementById('noteText').value='';
      refreshAdminList();
      loadAdminKB();
    }
  }catch(e){ noteStatus.className='admin-status err'; noteStatus.textContent='Error de red: '+e; }
};

// Las fichas de Admin vienen de texto plano extraído de un documento, casi
// siempre sin líneas en blanco entre secciones — mostrado tal cual es una
// pared de texto ilegible. Se detectan líneas cortas en MAYÚSCULAS o que
// empiezan con palabras tipo "REVISAR:"/"NOTA:" como encabezados, y las
// líneas cortas restantes se agrupan como lista, para dar estructura visual
// sin inventar contenido (el texto en sí no se toca, solo cómo se agrupa).
function textToHtml(t){
  const lines = String(t||"").split(/\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return '';
  const HEADER_WORD = /^(NOTA|REVISAR|IMPORTANTE|OJO|ERROR|VERIFICAR|ADVERTENCIA)[:\s]/i;
  const isHeaderish = l =>
    l.length <= 60 &&
    (HEADER_WORD.test(l) || (l === l.toUpperCase() && /[A-ZÁÉÍÓÚÑ]{3,}/.test(l)));
  let html = '', list = [];
  const flush = () => {
    if(list.length){
      html += `<ul class="arrow">${list.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
      list = [];
    }
  };
  for(const line of lines){
    if(isHeaderish(line)){
      flush();
      html += `<h4>${esc(line.replace(/:\s*$/,''))}</h4>`;
    }else if(line.length <= 100){
      list.push(line);
    }else{
      flush();
      html += `<p>${esc(line)}</p>`;
    }
  }
  flush();
  return html;
}
async function loadAdminKB(){
  try{
    const res=await fetch('/api/admin/public');
    const data=await res.json();
    for(let i=KB.length-1;i>=0;i--) if(KB[i]._admin) KB.splice(i,1);
    (data.entries||[]).forEach(e=>{
      KB.push({id:e.id, mod:e.mod||'13', title:e.title, kw:e.kw||[], src:e.src||'',
               _admin:true, body:textToHtml(e.body||'')});
    });
  }catch(e){ console.error('No se pudo cargar el conocimiento agregado por Admin', e); }
}
loadAdminKB();

const adminListEl=document.getElementById('adminList');
async function refreshAdminList(){
  try{
    const res=await fetch('/api/admin/list');
    const data=await res.json();
    adminListEl.innerHTML = data.count
      ? data.entries.map(e=>{
          const kw=e.kw||[];
          const shown=kw.slice(0,15).join(', ');
          const kwtxt=kw.length ? esc(shown)+(kw.length>15?` … (+${kw.length-15} más)`:'') : '(sin keywords)';
          return `<div class="row-wrap">
            <div class="row"><span>${esc(e.added_at||'')}</span><b>${esc(e.title)}</b>
              <span>[${esc(e.mod)}] ${esc(e.source_filename||'')}</span>
              <button class="rm" data-id="${esc(e.id)}" title="Eliminar">✕</button></div>
            <div class="kwline">🔑 ${kwtxt}</div>
          </div>`;
        }).join('')
      : '<div class="row" style="opacity:.6">Todavía no hay fichas agregadas desde Admin.</div>';
    adminListEl.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{
      await fetch('/api/admin/entry/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});
      refreshAdminList();
      loadAdminKB();
    });
  }catch(e){ adminListEl.innerHTML='<div class="row err">No se pudo cargar la lista.</div>'; }
}
